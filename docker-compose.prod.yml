services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runtrips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-runtrips}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-runtrips}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` — not reachable from outside the VM at all,
    # only from other containers on this compose network. Contrast with
    # docker-compose.yml (local dev), which publishes 5432 for convenience.

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Same as postgres: internal-only, no published port.

  api:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*' --no-server-header"
    # --proxy-headers/--forwarded-allow-ips: take the client IP from the
    # X-Forwarded-For header Caddy sets (Caddy replaces any client-supplied
    # value), so rate limits key on the real caller rather than Caddy's
    # container IP. Trusting '*' is safe only because `api` isn't reachable
    # except through Caddy.
    # No `ports:` and no source bind-mount (unlike the dev compose file) —
    # only reachable through the Caddy container, and runs the image as
    # built rather than live-reloading from a host mount.

  worker:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.workers.worker_settings.WorkerSettings"]

  backup:
    # Nightly pg_dump → ./backups on the VM (+ optional off-site copy to
    # S3/R2) — see ops/backup.sh for the restore command. Same image as
    # `postgres` so pg_dump matches the server's major version.
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runtrips}
      POSTGRES_DB: ${POSTGRES_DB:-runtrips}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: auto
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
